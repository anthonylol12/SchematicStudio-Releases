<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="300" rx="16" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#2d3748">¿Cómo elige el bloque que sustituye a otro?</text>
  <text x="450" y="62" text-anchor="middle" font-size="14" fill="#4a5568">Solo se comparan bloques de la misma forma (escalera con escalera, losa con losa…). Después se puntúa:</text>
  <g transform="translate(60,90)">
    <rect x="0" y="0" width="468" height="44" fill="#e57373"/>
    <rect x="468" y="0" width="101" height="44" fill="#64b5f6"/>
    <rect x="569" y="0" width="117" height="44" fill="#81c784"/>
    <rect x="686" y="0" width="94" height="44" fill="#ffb74d"/>
    <g font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="234" y="28">Color 60 %</text>
      <text x="518" y="28">Textura 13 %</text>
      <text x="627" y="28">Material 15 %</text>
      <text x="733" y="28">Nombre 12 %</text>
    </g>
  </g>
  <g font-size="14" fill="#2d3748">
    <text x="60" y="168"><tspan font-weight="bold" fill="#c62828">Color:</tspan> el color medio de su textura real (medido como lo ve el ojo humano, CIEDE2000).</text>
    <text x="60" y="192"><tspan font-weight="bold" fill="#1565c0">Textura:</tspan> si es lisa o con dibujo, y si tiene partes transparentes.</text>
    <text x="60" y="216"><tspan font-weight="bold" fill="#2e7d32">Material:</tspan> madera con madera, piedra con piedra, lana con lana…</text>
    <text x="60" y="240"><tspan font-weight="bold" fill="#ef6c00">Nombre:</tspan> palabras en común (por ejemplo «cherry_planks» y «birch_planks»).</text>
    <text x="60" y="274" fill="#4a5568">Si ninguno llega a la similitud mínima (60 % por defecto), el bloque se marca «Sin equivalencia» para que lo elijas tú.</text>
  </g>
</svg>

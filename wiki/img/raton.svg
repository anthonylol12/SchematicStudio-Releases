<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="330" rx="16" fill="#ffffff"/>
  <!-- Ratón -->
  <g transform="translate(70,40)">
    <rect x="0" y="0" width="150" height="240" rx="75" fill="#f1f3f7" stroke="#4a5568" stroke-width="3"/>
    <path d="M75,0 L75,95" stroke="#4a5568" stroke-width="3"/>
    <path d="M0,95 L150,95" stroke="#4a5568" stroke-width="3"/>
    <path d="M3,92 Q3,3 75,3 L75,92 z" fill="#cfe0ff"/>
    <path d="M147,92 Q147,3 75,3 L75,92 z" fill="#ffe2c2"/>
    <rect x="63" y="25" width="24" height="45" rx="12" fill="#d9f2df" stroke="#4a5568" stroke-width="2"/>
    <text x="35" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d3a6e">I</text>
    <text x="115" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a4a06">D</text>
  </g>
  <g font-size="16" fill="#2d3748">
    <rect x="270" y="30" width="18" height="18" rx="4" fill="#cfe0ff" stroke="#3d7be0"/>
    <text x="298" y="45"><tspan font-weight="bold">Botón izquierdo + arrastrar</tspan> → girar alrededor de la construcción</text>
    <text x="298" y="68" font-size="14" fill="#4a5568">Clic sin arrastrar → seleccionar un bloque (verás sus datos a la derecha)</text>

    <rect x="270" y="95" width="18" height="18" rx="4" fill="#ffe2c2" stroke="#e08a12"/>
    <text x="298" y="110"><tspan font-weight="bold">Botón derecho + arrastrar</tspan> → desplazar la vista (también Mayús + izquierdo)</text>

    <rect x="270" y="140" width="18" height="18" rx="4" fill="#d9f2df" stroke="#2f9e5b"/>
    <text x="298" y="155"><tspan font-weight="bold">Rueda</tspan> → acercar o alejar · botón central + arrastrar → desplazar</text>

    <text x="270" y="200" font-weight="bold">Teclas (con el visor seleccionado)</text>
    <text x="270" y="226" font-size="15">F  encuadrar  ·  5  isométrica  ·  1  frontal  ·  3  lateral  ·  7  superior</text>
    <text x="270" y="250" font-size="15">Ctrl+1 / Ctrl+3 / Ctrl+7  →  trasera / izquierda / inferior  ·  Esc  quitar selección</text>
    <text x="270" y="284" font-size="15">Ctrl+clic  añadir o quitar un bloque  ·  Mayús+clic  todos los del mismo tipo</text>
    <text x="270" y="308" font-size="15">Alt+clic en dos bloques  →  seleccionar la caja (región) entre ellos</text>
  </g>
</svg>
